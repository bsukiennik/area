name: Push to mirror

on:
  push:
    branches: [main]

jobs:
    push-to-mirror:
      name: Push to mirror
      if: ${{ github.repository_owner == 'bsukiennik' }}
      runs-on: ubuntu-latest
      steps:
        - name: Checkout commit
          uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Push to the mirror the repository
          uses: pixta-dev/repository-mirroring-action@v1
          with:
            target_repo_url:
              ${{ secrets.MIRROR_URL }}
            ssh_private_key:
              ${{ secrets.SSH_PRIVATE_KEY }}